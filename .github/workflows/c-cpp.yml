name: C++ Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile P1
      run: g++ P1.cpp -o P1

    - name: Compile P2
      run: g++ P2.cpp -o P2

    - name: Compile P3
      run: g++ P3.cpp -o P3

    - name: Compile P4
      run: g++ P4.cpp -o P4
