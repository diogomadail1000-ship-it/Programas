name: C++ Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build all cpp files
      run: |
        for file in *.cpp; do
          g++ "$file" -o "${file%.cpp}"
        done
